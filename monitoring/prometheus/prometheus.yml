global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'consul'
    metrics_path: '/v1/agent/telemetry'
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['consul-1:8500']
