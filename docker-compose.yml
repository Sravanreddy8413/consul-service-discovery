services:
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
    networks:
      - microservices

  service-a:
    build: ./service-a
    container_name: service-a
    expose:
      - "3001"
    depends_on:
      - consul
    networks:
      - microservices

  service-b:
    build: ./service-b
    container_name: service-b
    expose:
      - "3002"
    depends_on:
      - consul
    networks:
      - microservices

  service-c:
    build: ./service-c
    container_name: service-c
    expose:
      - "3003"
    depends_on:
      - consul
    networks:
      - microservices

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - service-a
      - service-b
      - service-c
    networks:
      - microservices

  # --- MONITORING STACK ---
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - service-a
      - service-b
      - service-c
    networks:
      - microservices

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus
    networks:
      - microservices

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - microservices

networks:
  microservices:
    driver: bridge

volumes:
  consul-data:
